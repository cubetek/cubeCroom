name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_commit:
        description: Exact release commit authorized by the calling main workflow
        type: string
        required: true
      build_installers:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build preview installers for the current product version (official main only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}-${{ inputs.source_commit }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  configure:
    name: Read the supported platform matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      build-installers: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'cubetek/cubeCroom' && github.ref == 'refs/heads/main' && inputs.build_installers }}
      tag: ${{ steps.preview.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      created-at: ${{ steps.preview.outputs.created-at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Bind every build and artifact to the checked-out source
        id: source
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; import { appendFileSync } from 'node:fs'; const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_COMMIT || '') || sha !== process.env.EXPECTED_COMMIT) throw new Error('CI source commit mismatch'); appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + sha + '\n');"
      - name: Export the central release targets
        id: targets
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { RELEASE_CONFIG } from './scripts/release/config.mjs'; appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include: RELEASE_CONFIG.targets }) + '\n');"
      - name: Bind requested preview installers to the product version and source commit
        id: preview
        if: github.event_name == 'workflow_dispatch' && github.repository == 'cubetek/cubeCroom' && github.ref == 'refs/heads/main' && inputs.build_installers
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node scripts/release/preview.mjs configure

  verify:
    needs: configure
    name: ${{ matrix.id }} · source and packaged smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}

    env:
      # Defer Electron's binary download until packaging; source checks do not launch it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CUBECROOM_PREVIEW_BUILD: ${{ needs.configure.outputs.build-installers == 'true' && '1' || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configure.outputs.commit }}
          persist-credentials: false

      - name: Export the exact preview source identity for subsequent checks
        if: needs.configure.outputs.build-installers == 'true'
        env:
          RELEASE_TAG: ${{ needs.configure.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.configure.outputs.commit }}
        run: |
          node -e "const fs = require('node:fs'); for (const name of ['RELEASE_TAG', 'RELEASE_COMMIT']) fs.appendFileSync(process.env.GITHUB_ENV, name + '=' + process.env[name] + '\n');"

      # package.json#packageManager is the single source of the pnpm version.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # النسخة من `.nvmrc` لا مكتوبةً هنا: رقمان لنسخة واحدة يفترقان،
          # ويومَ يفترقان يُفحص المشروع على ما لا يُطوَّر عليه.
          node-version-file: .nvmrc
          cache: pnpm

      # DoD المرحلة صفر: «تشغيل نظيف على جهاز بلا حالة سابقة».
      # frozen-lockfile يضمن أن ما يُبنى هو ما في القفل لا ما يُحلّ لحظياً.
      - name: تثبيت التبعيات
        run: pnpm install --frozen-lockfile

      - name: فحص الأنواع
        run: pnpm typecheck

      - name: Verify one product version across the release PR
        run: pnpm version:check

      # Lint once; runtime and native package checks run on every configured target.
      - name: التدقيق
        if: matrix.platform == 'linux'
        run: pnpm lint

      - name: البناء
        run: pnpm build

      - name: الاختبارات
        run: pnpm test

      - name: فحص قواعد الإصدار وبيانات التحديث
        run: node --test scripts/release/test/*.test.mjs

      - name: فحص خدمة التحديث وحماية الحفظ
        run: node --test scripts/test-updates.mjs scripts/test-update-flush.mjs

      - name: فحص الدخان
        run: pnpm smoke

      - name: Package the already built application without release credentials
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
          CUBECROOM_OUT_DIR: out-ci
          CUBECROOM_REQUIRE_SIGNING: '0'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BUILD_INSTALLERS: ${{ needs.configure.outputs.build-installers }}
        run: |
          node scripts/bundle-desktop.mjs --stage
          if [[ "$BUILD_INSTALLERS" == "true" ]]; then
            node scripts/package-app.mjs make
          else
            node scripts/package-app.mjs package
          fi

      - name: Run the packaged application with isolated test data
        env:
          CUBECROOM_OUT_DIR: out-ci
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            node scripts/release/prepare-linux-sandbox.mjs
            xvfb-run -a node scripts/test-packaged.mjs
          else
            node scripts/test-packaged.mjs
          fi

      - name: Verify the actual preview installers
        if: needs.configure.outputs.build-installers == 'true'
        env:
          CUBECROOM_OUT_DIR: out-ci
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node scripts/release/preview-install-smoke.mjs
          else
            node scripts/release/preview-install-smoke.mjs
          fi

      - name: Retain verified preview binaries and internal build evidence
        if: needs.configure.outputs.build-installers == 'true'
        env:
          CUBECROOM_OUT_DIR: out-ci
        run: node scripts/release/preview.mjs collect

      - name: Upload preview target for assembly
        if: needs.configure.outputs.build-installers == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-target-${{ matrix.id }}
          path: dist/preview-target/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Archive the validated application and checksums
        env:
          CUBECROOM_OUT_DIR: out-ci
        run: node scripts/release/archive-validation.mjs

      - name: Retain native validation packages without publishing a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.id }}-${{ needs.configure.outputs.commit }}
          path: dist/validation/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Retain packaged smoke diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-smoke-${{ matrix.id }}
          path: |
            .cubeflow/reports/packaged-smoke/*/runtime.log
            .cubeflow/reports/packaged-smoke/*/settings-updates.png
            .cubeflow/reports/packaged-smoke/*/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  preview:
    name: Assemble the complete preview installer set
    needs: [configure, verify]
    if: needs.configure.outputs.build-installers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configure.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: preview-target-*
          path: dist/preview-input
      - name: Revalidate every target and exclude updater feeds from the public preview
        env:
          RELEASE_TAG: ${{ needs.configure.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.configure.outputs.commit }}
          PREVIEW_CREATED_AT: ${{ needs.configure.outputs.created-at }}
        run: node scripts/release/preview.mjs assemble
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-installers-${{ needs.configure.outputs.commit }}
          path: dist/preview-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  attest:
    name: Attest validated archives from the official main branch
    needs: [configure, verify, preview]
    if: always() && !cancelled() && needs.verify.result == 'success' && (needs.preview.result == 'success' || needs.preview.result == 'skipped') && github.repository == 'cubetek/cubeCroom' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # A separate job keeps OIDC and write permissions away from PR/source execution.
      # Omitting run-id/repository downloads only artifacts from this workflow run.
      - name: Download the successful native validation packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: validation-*-${{ needs.configure.outputs.commit }}
          path: dist/validation-attest

      - name: Check the archived bytes before attestation
        run: |
          for directory in dist/validation-attest/*/; do
            (cd "$directory" && sha512sum --check --strict SHA512SUMS)
          done

      - name: Sign GitHub build provenance for the validation archives
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/validation-attest/*/*.tar.gz
          create-storage-record: false

      - name: Retain the provenance verification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-provenance-${{ needs.configure.outputs.commit }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Download the assembled preview installers
        if: needs.configure.outputs.build-installers == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-installers-${{ needs.configure.outputs.commit }}
          path: dist/preview-release
      - name: Check the final preview installer and metadata hashes
        if: needs.configure.outputs.build-installers == 'true'
        working-directory: dist/preview-release
        run: sha512sum --check --strict SHA512SUMS
      - name: Attest the final preview binaries and metadata
        if: needs.configure.outputs.build-installers == 'true'
        id: preview
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/preview-release/*
          create-storage-record: false
      - name: Retain the preview verification bundle
        if: needs.configure.outputs.build-installers == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-provenance-${{ needs.configure.outputs.commit }}
          path: ${{ steps.preview.outputs.bundle-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
