name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag, for example v0.2.0
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA targeted by that draft
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Serialize all platform builds, retries and publication. Never cancel a publisher.
concurrency:
  group: official-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'cubetek/cubeCroom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.resolve.outcome == 'success' }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      channel: ${{ steps.resolve.outputs.channel }}
      mode: ${{ steps.resolve.outputs.mode }}
      created_at: ${{ steps.resolve.outputs.created_at }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Resolve and authorize the exact draft commit and committed release policy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: node scripts/release/resolve.mjs

  preview:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.mode == 'preview'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}
      build_installers: true

  publish-preview:
    needs: [prepare, preview]
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.mode == 'preview'
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 60
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # These artifacts can only come from this run's successful reusable CI.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-installers-${{ needs.prepare.outputs.commit }}
          path: dist/preview-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-provenance-${{ needs.prepare.outputs.commit }}
          path: dist/preview-provenance
      - name: Install the public provenance bundle
        run: |
          node --input-type=module -e "import { readdirSync, copyFileSync } from 'node:fs'; const files = readdirSync('dist/preview-provenance'); if (files.length !== 1 || !files[0].endsWith('.json')) throw new Error('Expected one provenance bundle'); copyFileSync('dist/preview-provenance/' + files[0], 'dist/preview-release/attestation.json');"
      - name: Publish complete preview installers with checksums and verified provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLIC_PUBLISH_ENABLED }}
        run: node scripts/release/publish-preview.mjs

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.mode == 'signed'
    name: Package ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_TARGET: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source validation on the target runner
        run: pnpm verify
      - name: Select isolated output directory
        id: paths
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'out=' + require('node:path').resolve('dist/release-target') + '\n')"
      - name: Build, sign, and notarize without publishing
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
          CUBECROOM_OUT_DIR: ${{ steps.paths.outputs.out }}
          CUBECROOM_REQUIRE_SIGNING: '1'
          CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WINDOWS_CSC_LINK || matrix.platform == 'darwin' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.platform == 'darwin' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CUBECROOM_WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && vars.APPLE_TEAM_ID || '' }}
        run: |
          node scripts/release/preflight.mjs
          node scripts/bundle-desktop.mjs --stage
          node scripts/package-app.mjs make
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            node scripts/release/prepare-linux-sandbox.mjs
            xvfb-run -a node scripts/test-packaged.mjs
          else
            node scripts/test-packaged.mjs
          fi
          node scripts/release/verify-target.mjs
      - name: Retain packaged smoke diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-smoke-${{ matrix.id }}
          path: |
            .cubeflow/reports/packaged-smoke/*/runtime.log
            .cubeflow/reports/packaged-smoke/*/settings-updates.png
            .cubeflow/reports/packaged-smoke/*/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.id }}
          path: |
            dist/release-target/*.exe
            dist/release-target/*.dmg
            dist/release-target/*.zip
            dist/release-target/*.AppImage
            dist/release-target/*.yml
            dist/release-target/*.blockmap
            dist/release-target/packaging-checks-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_CREATED_AT: ${{ needs.prepare.outputs.created_at }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the shared manifest verifier
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cubecroom/core... build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release-input
      - name: Assemble all targets and sign the release manifest
        env:
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/release/assemble.mjs
      - name: Publish the reviewed release and verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLIC_PUBLISH_ENABLED }}
        run: node scripts/release/publish.mjs
