name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag, for example v0.2.0
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA targeted by that draft
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    # GitHub's bash wrapper fails on the first unsuccessful command on all four runners.
    shell: bash

# Serialize release creation, retries, and publication. Do not cancel a publisher midway.
concurrency:
  group: official-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'cubetek/cubeCroom' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.RELEASE_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: release-automation
    outputs:
      ready: ${{ steps.resolve.outcome == 'success' }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      channel: ${{ steps.resolve.outputs.channel }}
      created_at: ${{ steps.resolve.outputs.created_at }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check automatic release preparation setup
        if: github.event_name == 'push'
        id: automation
        env:
          RELEASE_APP_CONFIGURED: ${{ vars.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$RELEASE_APP_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_APP_CONFIGURED" != "true" ]]; then
            echo "Automatic Release Please preparation is skipped until RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are configured. Manual release dispatch remains available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep an unfinished draft from advancing release history
        if: github.event_name == 'push' && steps.automation.outputs.configured == 'true'
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/pending-draft.mjs
      # App-created Release PRs trigger normal CI. GITHUB_TOKEN-created PRs do not.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: github.event_name == 'push' && steps.automation.outputs.configured == 'true' && steps.draft.outputs.pending != 'true'
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push' && steps.automation.outputs.configured == 'true' && steps.draft.outputs.pending != 'true'
        id: please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main
      - name: Resolve and authorize the exact draft commit
        if: github.event_name == 'workflow_dispatch' || steps.please.outputs.release_created == 'true'
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || steps.please.outputs.tag_name }}
          RELEASE_COMMIT: ${{ inputs.commit || steps.please.outputs.sha }}
        run: node scripts/release/resolve.mjs

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    name: Package ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_TARGET: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source validation on the target runner
        run: pnpm verify
      - name: Select isolated output directory
        id: paths
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'out=' + require('node:path').resolve('dist/release-target') + '\n')"
      - name: Build, sign, and notarize without publishing
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
          CUBECROOM_OUT_DIR: ${{ steps.paths.outputs.out }}
          CUBECROOM_REQUIRE_SIGNING: '1'
          CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WINDOWS_CSC_LINK || matrix.platform == 'darwin' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.platform == 'darwin' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CUBECROOM_WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && vars.APPLE_TEAM_ID || '' }}
        run: |
          node scripts/release/preflight.mjs
          node scripts/bundle-desktop.mjs --stage
          node scripts/package-app.mjs make
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            node scripts/release/prepare-linux-sandbox.mjs
            xvfb-run -a node scripts/test-packaged.mjs
          else
            node scripts/test-packaged.mjs
          fi
          node scripts/release/verify-target.mjs
      - name: Retain packaged smoke diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-smoke-${{ matrix.id }}
          path: |
            .cubeflow/reports/packaged-smoke/*/runtime.log
            .cubeflow/reports/packaged-smoke/*/settings-updates.png
            .cubeflow/reports/packaged-smoke/*/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.id }}
          path: |
            dist/release-target/*.exe
            dist/release-target/*.dmg
            dist/release-target/*.zip
            dist/release-target/*.AppImage
            dist/release-target/*.yml
            dist/release-target/*.blockmap
            dist/release-target/packaging-checks-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_CREATED_AT: ${{ needs.prepare.outputs.created_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the shared manifest verifier
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cubecroom/core... build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release-input
      - name: Assemble all targets and sign the release manifest
        env:
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/release/assemble.mjs
      - name: Publish the reviewed release and verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLIC_PUBLISH_ENABLED }}
        run: node scripts/release/publish.mjs
