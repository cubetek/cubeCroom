<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
    @keyframes dcSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(220%); } }
    .bar { animation: dcSlide 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: translateX(50%); } }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 1280px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
    <div style="width: 72px; height: 72px; border-radius: 22px; background: #0F766E;"></div>
    <div style="font-size: 30px; font-weight: 700; line-height: 1.35;">CubeCroom</div>
    <div style="width: 168px; height: 4px; border-radius: 999px; background: #E2E8F0; overflow: hidden;">
      <div class="bar" style="width: 46%; height: 4px; border-radius: 999px; background: #0F766E;"></div>
    </div>
  </div>

  <div style="position: absolute; bottom: 28px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94A3B8;">
    <span style="font-variant-numeric: tabular-nums;">الإصدار ١٫٠</span>
  </div>

</div>
