<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
    @keyframes dcSpin { to { transform: rotate(360deg); } }
    .spin { animation: dcSpin 1.6s linear infinite; transform-origin: 50% 50%; }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 360px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.75; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; height: 56px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px; padding: 0 20px;">
    <div style="width: 26px; height: 26px; border-radius: 8px; background: #0F766E; flex-shrink: 0;"></div>
    <div style="font-size: 16px; font-weight: 700;">CubeCroom</div>
  </div>

  <div style="flex-grow: 1; padding: 24px 20px; display: flex; flex-direction: column; min-height: 0;">

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px;">

      <div style="position: relative; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center;">
        <svg class="spin" width="76" height="76" viewBox="0 0 76 76" fill="none">
          <circle cx="38" cy="38" r="34" stroke="#E2E8F0" stroke-width="4"></circle>
          <path d="M38 4a34 34 0 0 1 34 34" stroke="#0F766E" stroke-width="4" stroke-linecap="round"></path>
        </svg>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute;"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
      </div>

      <div style="font-size: 24px; font-weight: 700; line-height: 1.35; margin-top: 20px;">تم إرسال طلبك</div>
      <div style="font-size: 15px; color: #334155; max-width: 30ch;">بانتظار موافقة معلمك على دخولك.</div>

      <div style="display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 6px; background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; font-size: 14px; font-weight: 600; margin-top: 14px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
        <span>طلب بانتظار الموافقة</span>
      </div>

      <div style="width: 100%; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; text-align: right;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: #F0FDFA; color: #115E59; flex-shrink: 0;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"></path><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>
          </div>
          <div style="flex-grow: 1; min-width: 0;">
            <div style="font-size: 15px; font-weight: 600; line-height: 1.4;">الصف السادس — علوم</div>
            <div style="font-size: 13px; color: #64748B;">أ. سارة العتيبي</div>
          </div>
        </div>
        <div style="height: 1px; background: #E2E8F0;"></div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="flex-grow: 1; min-width: 0;">
            <div style="font-size: 12px; color: #64748B;">الاسم الذي أرسلته</div>
            <div style="font-size: 15px; font-weight: 500;">ريم عبدالله المطيري</div>
          </div>
          <div style="display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border-radius: 10px; background: #FFFFFF; border: 1px solid #7C8CA0; color: #0F172A; font-size: 14px; font-weight: 600; flex-shrink: 0;">تعديل</div>
        </div>
      </div>

    </div>

    <div style="display: flex; align-items: flex-start; gap: 9px; padding: 14px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 13px; color: #334155; line-height: 1.6;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><polyline points="20 4 20 9 15 9"></polyline></svg>
      <span>تُفتح الصفحة تلقائياً بمجرد موافقة معلمك — أبقِها مفتوحة ولا تحتاج إلى تحديثها.</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
