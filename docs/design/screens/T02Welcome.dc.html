<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 1280px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.7; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 32px;">
    <div style="width: 28px; height: 28px; border-radius: 9px; background: #0F766E; flex-shrink: 0;"></div>
    <div style="font-size: 16px; font-weight: 700;">CubeCroom</div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #0F766E;"></div>
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #E2E8F0;"></div>
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #E2E8F0;"></div>
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #E2E8F0;"></div>
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #E2E8F0;"></div>
      <div style="font-size: 13px; color: #64748B; margin-inline-start: 6px; font-variant-numeric: tabular-nums;">الخطوة ١ من ٥</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 0 32px 64px;">
    <div style="width: 620px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;">

      <div style="width: 64px; height: 64px; border-radius: 20px; background: #0F766E;"></div>

      <div style="font-size: 30px; font-weight: 700; line-height: 1.4; margin-top: 22px;">أهلاً بك — لن يستغرق الإعداد سوى دقائق.</div>

      <div style="font-size: 16px; color: #334155; line-height: 1.8; max-width: 52ch; margin-top: 10px;">كل شيء في CubeCroom يعمل على هذا الجهاز: فصولك ودروسك وملفات طلابك محفوظة عندك، ولا تحتاج إلى إنترنت لتشغيل حصتك.</div>

      <div style="font-size: 16px; color: #334155; line-height: 1.8; max-width: 52ch; margin-top: 8px;">سنسألك عن اسمك، وأين تُحفظ بياناتك — ثم تبدأ.</div>

      <div style="display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 52px; padding: 0 40px; border-radius: 10px; background: #0F766E; color: #FFFFFF; font-size: 17px; font-weight: 600; margin-top: 28px;">
        <span>ابدأ</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
      </div>

      <div style="font-size: 13px; color: #64748B; margin-top: 14px;">خمس خطوات قصيرة، اثنتان منها اختياريتان.</div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
