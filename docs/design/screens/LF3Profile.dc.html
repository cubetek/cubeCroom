<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 640px; height: 400px; overflow: hidden; background: #FFFFFF; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.7; display: flex; flex-direction: column; border: 1.5px solid #94A3B8;">

  <div style="flex-shrink: 0; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1.5px solid #E2E8F0; background: #FAFAFA;">
    <div style="padding: 2px 8px; border: 1px solid #94A3B8; border-radius: 999px; font-size: 10px; font-weight: 600; color: #475569;">T03</div>
    <div style="font-size: 12px; font-weight: 600;">بيانات المعلم</div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <div style="width: 16px; height: 3px; border-radius: 999px; background: #0F766E;"></div>
      <div style="width: 16px; height: 3px; border-radius: 999px; background: #0F766E;"></div>
      <div style="width: 16px; height: 3px; border-radius: 999px; background: #E2E8F0;"></div>
      <div style="width: 16px; height: 3px; border-radius: 999px; background: #E2E8F0;"></div>
      <div style="width: 16px; height: 3px; border-radius: 999px; background: #E2E8F0;"></div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 22px 60px; display: flex; flex-direction: column; justify-content: center; gap: 14px;">
    <div style="font-size: 18px; font-weight: 700;">عرّفنا بنفسك</div>

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <div style="font-size: 12px; color: #334155; font-weight: 500;">الاسم <span style="color: #991B1B;">*</span></div>
      <div style="height: 34px; border: 1.5px solid #94A3B8; border-radius: 6px; display: flex; align-items: center; padding: 0 10px;">
        <div style="width: 130px; height: 7px; background: #E2E8F0; border-radius: 3px;"></div>
      </div>
      <div style="font-size: 11px; color: #64748B;">يظهر لطلابك في صفحاتهم.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <div style="font-size: 12px; color: #334155; font-weight: 500;">اسم المؤسسة أو المدرسة <span style="color: #64748B; font-weight: 400;">— اختياري</span></div>
      <div style="height: 34px; border: 1.5px dashed #94A3B8; border-radius: 6px;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px;">
      <div style="padding: 9px 18px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 13px; color: #475569;">رجوع</div>
      <div style="flex-grow: 1;"></div>
      <div style="padding: 9px 28px; border: 1.5px solid #0F766E; background: #F0FDFA; border-radius: 8px; font-size: 13px; font-weight: 600; color: #115E59;">التالي</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 14px; border-top: 1.5px solid #E2E8F0; background: #FAFAFA; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 12px; color: #334155; line-height: 1.6;"><span style="font-weight: 600;">القاعدة:</span> حقلان لا أكثر — «الاسم فقط + خيار اسم المؤسسة (اختياري)». لا بريد ولا كلمة مرور: لا حساب هنا أصلاً.</div>
    <div style="font-size: 12px; color: #475569; line-height: 1.6;">زر «رجوع» موجود لأن الخطوات محفوظة ولا تعتمد إحداها على الأخرى.</div>
  </div>

</div>
</x-dc>
</body>
</html>
