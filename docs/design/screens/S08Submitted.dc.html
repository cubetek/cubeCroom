<div dir="rtl" style="box-sizing: border-box; width: 360px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.75; display: flex; flex-direction: column;">

      <div style="width: 100%; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; text-align: right;">
        <div style="display: flex; align-items: center; gap: 12px;">

            <div style="font-size: 13px; color: #64748B; font-variant-numeric: tabular-nums;">٥ أسئلة · أجبت عن ٥</div>
          </div>
        </div>
        <div style="height: 1px; background: #E2E8F0;"></div>
        <div style="display: flex; align-items: center; gap: 10px;">
