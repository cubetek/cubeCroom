    <div style="font-size: 12px; color: #334155; line-height: 1.6;"><span style="font-weight: 600;">القاعدة:</span> لا logs ولا رسائل تقنية. إذا طال التشغيل يظهر سطر واحد: «نجهّز بياناتك…».</div>
    <div style="font-size: 12px; color: #475569; line-height: 1.6;">مسار الاسترجاع يظهر <span style="font-weight: 600;">عند الحاجة فقط</span> — وهو حالة `T06 خطأ مانع` نفسها.</div>
