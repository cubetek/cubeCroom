<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 360px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.75; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; height: 56px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px; padding: 0 20px;">
    <div style="width: 26px; height: 26px; border-radius: 8px; background: #0F766E; flex-shrink: 0;"></div>
    <div style="font-size: 16px; font-weight: 700;">CubeCroom</div>
  </div>

  <div style="flex-grow: 1; padding: 24px 20px; display: flex; flex-direction: column; min-height: 0;">

    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: #F0FDFA; color: #115E59; flex-shrink: 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"></path><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 17px; font-weight: 600; line-height: 1.4;">الصف السادس — علوم</div>
        <div style="font-size: 13px; color: #64748B;">أ. سارة العتيبي</div>
      </div>
    </div>

    <div style="font-size: 24px; font-weight: 700; line-height: 1.35; margin-top: 24px;">الانضمام إلى الفصل</div>
    <div style="font-size: 15px; color: #334155; margin-top: 2px;">اكتب اسمك وأرسل طلب الدخول — سيوافق معلمك عليه من جهازه.</div>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 24px;">
      <div style="display: flex; align-items: center; gap: 5px;">
        <span style="font-size: 15px; font-weight: 500;">اسمك</span>
        <span style="font-size: 15px; color: #991B1B;">*</span>
      </div>
      <div style="height: 48px; display: flex; align-items: center; padding: 0 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #7C8CA0; color: #94A3B8;">اكتب اسمك الكامل</div>
      <div style="font-size: 13px; color: #64748B;">يظهر لمعلمك كما تكتبه.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 18px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 15px; font-weight: 500;">رقمك في الفصل</span>
        <span style="font-size: 13px; color: #64748B;">اختياري</span>
      </div>
      <div style="height: 48px; display: flex; align-items: center; padding: 0 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #7C8CA0; color: #94A3B8;">إن طلبه معلمك</div>
    </div>

    <div style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #0F766E; color: #FFFFFF; font-size: 17px; font-weight: 600; margin-top: 26px;">طلب الدخول</div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: flex-start; gap: 9px; padding: 14px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 13px; color: #334155; line-height: 1.6;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <span>لا تحتاج إلى حساب ولا كلمة مرور. اسمك يُرسَل إلى جهاز معلمك فقط.</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
