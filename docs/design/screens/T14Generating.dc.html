<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
    @keyframes dcPulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .sk { background: #E2E8F0; border-radius: 6px; animation: dcPulse 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 420px; height: 800px; overflow: hidden; background: #FFFFFF; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.7; display: flex; flex-direction: column; border-inline-start: 1px solid #DDD6FE;">

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: #F5F3FF; border-bottom: 1px solid #DDD6FE;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B21B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.75 4.55 4.55 1.75-4.55 1.75L12 15.8l-1.75-4.55L5.7 9.5l4.55-1.75Z"></path><path d="M18 15.6l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7Z"></path></svg>
    <div style="flex-grow: 1; font-size: 16px; font-weight: 600; color: #5B21B6;">مساعدة الذكاء الاصطناعي</div>
    <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; color: #5B21B6;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 0;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 6px; background: #F5F3FF; border: 1px solid #DDD6FE; color: #5B21B6; font-size: 13px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4"></path><path d="M16 12H8"></path><path d="M14 17h-4"></path></svg>
        <span>بسّط</span>
      </div>
      <div style="font-size: 13px; color: #64748B;">على النص المحدَّد</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #F5F3FF; border: 1px solid #DDD6FE; border-radius: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B21B6" stroke-width="2.4" stroke-linecap="round" style="flex-shrink: 0;"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 14px; font-weight: 600; color: #5B21B6;">جارٍ التوليد…</div>
        <div style="font-size: 12px; color: #475569;">قد يستغرق بضع ثوانٍ حسب مزوّدك.</div>
      </div>
    </div>

    <div style="border: 1px solid #E2E8F0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 9px;">
      <div class="sk" style="width: 46%; height: 15px;"></div>
      <div class="sk" style="width: 100%; height: 12px;"></div>
      <div class="sk" style="width: 92%; height: 12px;"></div>
      <div class="sk" style="width: 97%; height: 12px;"></div>
      <div class="sk" style="width: 64%; height: 12px;"></div>
      <div class="sk" style="width: 38%; height: 15px; margin-top: 6px;"></div>
      <div class="sk" style="width: 88%; height: 12px;"></div>
      <div class="sk" style="width: 95%; height: 12px; opacity: .6;"></div>
      <div class="sk" style="width: 52%; height: 12px; opacity: .35;"></div>
    </div>

    <div style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; background: #FFFFFF; border: 1px solid #7C8CA0; color: #0F172A; font-size: 14px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      <span>إيقاف</span>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: flex-start; gap: 9px; padding: 12px; background: #F8FAFC; border-radius: 10px; font-size: 12px; color: #475569; line-height: 1.6;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><line x1="12" y1="7.5" x2="12" y2="7.5"></line></svg>
      <span>درسك لم يتغيّر بعد. النتيجة تظهر للمعاينة أولاً، ثم تختار ما تفعله بها.</span>
    </div>

  </div>

  <div style="flex-shrink: 0; padding: 12px 20px; border-top: 1px solid #E2E8F0; background: #F8FAFC; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 11px; color: #64748B;">المزوّد والنموذج</div>
      <div dir="ltr" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #334155; text-align: left;">Claude · claude-sonnet-4.5</div>
    </div>
    <div style="font-size: 13px; color: #94A3B8; font-weight: 600; white-space: nowrap;">تغيير</div>
  </div>

</div>
</x-dc>
</body>
</html>
