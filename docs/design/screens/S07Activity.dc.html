<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 360px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.75; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E2E8F0;">
    <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: #334155; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">اختبار قصير: الكائنات الحية</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 20px 12px;">
      <div style="flex-grow: 1; height: 6px; border-radius: 999px; background: #E2E8F0; overflow: hidden;">
        <div style="width: 40%; height: 6px; border-radius: 999px; background: #0F766E;"></div>
      </div>
      <div style="font-size: 13px; color: #64748B; font-variant-numeric: tabular-nums; white-space: nowrap;">سؤال ٢ من ٥</div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0;">

    <div style="font-size: 19px; font-weight: 600; line-height: 1.6;">أيّ ممّا يلي يُعدّ من خصائص الكائنات الحية؟</div>

    <div style="display: flex; flex-direction: column; gap: 10px;">

      <div style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #7C8CA0;">
        <div style="width: 20px; height: 20px; border-radius: 999px; border: 1px solid #7C8CA0; flex-shrink: 0;"></div>
        <div style="font-size: 16px; line-height: 1.6;">أن يكون له لون ثابت</div>
      </div>

      <div style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #F0FDFA; border: 2px solid #0F766E;">
        <div style="width: 20px; height: 20px; border-radius: 999px; border: 6px solid #0F766E; background: #FFFFFF; flex-shrink: 0;"></div>
        <div style="font-size: 16px; font-weight: 600; line-height: 1.6;">أن ينمو ويتكاثر</div>
      </div>

      <div style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #7C8CA0;">
        <div style="width: 20px; height: 20px; border-radius: 999px; border: 1px solid #7C8CA0; flex-shrink: 0;"></div>
        <div style="font-size: 16px; line-height: 1.6;">أن يكون صلباً</div>
      </div>

      <div style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #7C8CA0;">
        <div style="width: 20px; height: 20px; border-radius: 999px; border: 1px solid #7C8CA0; flex-shrink: 0;"></div>
        <div style="font-size: 16px; line-height: 1.6;">أن يُصنع في المصنع</div>
      </div>

    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #166534;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <span>إجاباتك محفوظة على هذا الجهاز — لو أُغلقت الصفحة ستجدها كما تركتها.</span>
    </div>

    <div style="flex-grow: 1;"></div>

  </div>

  <div style="flex-shrink: 0; padding: 14px 20px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; align-items: center; gap: 12px;">
    <div style="width: 104px; flex-shrink: 0; height: 52px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; background: #FFFFFF; border: 1px solid #7C8CA0; color: #0F172A; font-size: 16px; font-weight: 600;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
      <span>السابق</span>
    </div>
    <div style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; background: #0F766E; color: #FFFFFF; font-size: 17px; font-weight: 600;">
      <span>التالي</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
