<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 360px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.75; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 12px 20px; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 17px; font-weight: 700; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">الصف السادس — علوم</div>
      <div style="font-size: 13px; color: #64748B;">أ. سارة العتيبي</div>
    </div>
    <div style="width: 38px; height: 38px; border-radius: 999px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #475569; flex-shrink: 0;">ر</div>
  </div>

  <div style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-height: 0;">

    <div style="display: flex; align-items: flex-start; gap: 11px; padding: 14px; background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 600; color: #166534; line-height: 1.45;">أهلاً ريم — أنت الآن في الفصل</div>
        <div style="font-size: 13px; color: #334155;">وافق معلمك على دخولك.</div>
      </div>
    </div>

    <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.06); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;">

      <svg width="86" height="70" viewBox="0 0 96 78" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="20" y="10" width="56" height="60" rx="6"></rect>
        <path d="M32 26h32M32 38h32M32 50h20" stroke="#E2E8F0"></path>
      </svg>

      <div style="font-size: 19px; font-weight: 700; line-height: 1.4; margin-top: 16px;">لم يُنشر أي درس بعد</div>
      <div style="font-size: 14px; color: #334155; max-width: 30ch; margin-top: 2px;">ستجد دروس معلمك وأنشطته هنا فور نشرها. لا حاجة لتحديث الصفحة.</div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 22px; padding: 10px 14px; background: #F8FAFC; border-radius: 10px; font-size: 13px; color: #475569;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
        <span>تُحدَّث الصفحة تلقائياً</span>
      </div>

    </div>

  </div>

  <div style="flex-shrink: 0; height: 66px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; align-items: stretch;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #0F766E;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H10v6H4a1 1 0 0 1-1-1z"></path></svg>
      <div style="font-size: 12px; font-weight: 600;">الرئيسية</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #64748B;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"></path><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>
      <div style="font-size: 12px;">الدروس</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #64748B;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1"></path><rect x="8" y="2" width="8" height="4" rx="1"></rect><polyline points="9 13 11 15 15 11"></polyline></svg>
      <div style="font-size: 12px;">الأنشطة</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
