<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F766E; } a:hover { color: #115E59; }
  </style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; width: 360px; height: 800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.75; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; height: 56px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px; padding: 0 20px;">
    <div style="width: 26px; height: 26px; border-radius: 8px; background: #0F766E; flex-shrink: 0;"></div>
    <div style="font-size: 16px; font-weight: 700;">CubeCroom</div>
  </div>

  <div style="flex-grow: 1; padding: 24px 20px; display: flex; flex-direction: column; min-height: 0;">

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px;">

      <div style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 999px; background: #F1F5F9; border: 1px solid #CBD5E1; color: #475569;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="8.5" y1="12" x2="15.5" y2="12"></line></svg>
      </div>

      <div style="font-size: 24px; font-weight: 700; line-height: 1.35; margin-top: 20px;">لم تُقبل في هذا الفصل</div>
      <div style="font-size: 15px; color: #334155; max-width: 32ch;">لم يوافق معلمك على طلب دخولك. إن كنت تظن أن هذا خطأ، تحدّث معه ثم أعد المحاولة.</div>

      <div style="width: 100%; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; margin-top: 24px; display: flex; align-items: center; gap: 12px; text-align: right;">
        <div style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: #F1F5F9; color: #475569; flex-shrink: 0;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"></path><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 600; line-height: 1.45;">الصف السادس — علوم</div>
          <div style="font-size: 13px; color: #64748B;">أ. سارة العتيبي</div>
        </div>
      </div>

      <div style="width: 100%; display: flex; align-items: flex-start; gap: 9px; padding: 12px 14px; background: #F1F5F9; border-radius: 12px; margin-top: 14px; font-size: 13px; color: #475569; line-height: 1.6; text-align: right;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><line x1="12" y1="7.5" x2="12" y2="7.5"></line></svg>
        <span>لم تُحفظ عنك أي بيانات، ولا يظهر اسمك في الفصل.</span>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; background: #0F766E; color: #FFFFFF; font-size: 17px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><polyline points="20 4 20 9 15 9"></polyline></svg>
        <span>إرسال الطلب مرة أخرى</span>
      </div>
      <div style="font-size: 12px; color: #64748B; text-align: center; line-height: 1.6;">تحدّث مع معلمك أولاً، فسيرى طلبك من جديد.</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
