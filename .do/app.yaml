name: cubecroom-docs
static_sites:
  - name: cubecroom-docs
    github:
      repo: cubetek/cubeCroom
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: .do/docs.Dockerfile
    output_dir: apps/docs/out
    index_document: index.html
    error_document: 404.html
ingress:
  rules:
    - component:
        name: cubecroom-docs
      match:
        path:
          prefix: /
